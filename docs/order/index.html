<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد طلبك في تدوير | Tadwir</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="card">
  <div class="logo">♻️</div>
  <h1>تأكيد طلبك في تدوير</h1>
  <p class="sub">أدخل رقم جوالك وراح توصلك رسالة تأكيد الطلب.</p>
  <form id="form" autocomplete="off">
    <label for="country">الدولة</label>
    <div class="row">
      <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="رقم الجوال" required>
      <select id="country" name="country">
        <option value="EG">🇪🇬 مصر</option>
        <option value="SA">🇸🇦 السعودية</option>
        <option value="AE">🇦🇪 الإمارات</option>
        <option value="KW">🇰🇼 الكويت</option>
        <option value="BH">🇧🇭 البحرين</option>
        <option value="QA">🇶🇦 قطر</option>
        <option value="OM">🇴🇲 عُمان</option>
        <option value="JO">🇯🇴 الأردن</option>
        <option value="LB">🇱🇧 لبنان</option>
        <option value="IQ">🇮🇶 العراق</option>
        <option value="SY">🇸🇾 سوريا</option>
        <option value="YE">🇾🇪 اليمن</option>
        <option value="PS">🇵🇸 فلسطين</option>
        <option value="LY">🇱🇾 ليبيا</option>
        <option value="SD">🇸🇩 السودان</option>
        <option value="TN">🇹🇳 تونس</option>
        <option value="DZ">🇩🇿 الجزائر</option>
        <option value="MA">🇲🇦 المغرب</option>
      </select>
    </div>
    <button id="btn" type="submit">أكّد الطلب</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
  <footer>نموذج تجريبي · Demo</footer>
</main>
<script src="../config.js"></script>
<script>window.CONFIG = { ...window.CONFIG_BASE, KIND: "order" };</script>
<script src="../shared/app.js"></script>
</body>
</html>
