<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرحباً بك في تدوير | Tadwir</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<main class="card">
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ar" aria-pressed="true">العربية</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </div>
  <div class="logo">♻️</div>
  <h1 id="h1">مرحباً بك في تدوير</h1>
  <p class="sub" id="sub"></p>
  <form id="form" autocomplete="off">
    <label for="country" id="countryLabel">الدولة</label>
    <select id="country" name="country"><option value="EG">🇪🇬 مصر</option></select>
    <label id="methodLabel">طريقة الاستلام</label>
    <div class="seg" role="group" aria-label="Method">
      <button type="button" data-method="sms" aria-pressed="true">رقم الجوال</button>
      <button type="button" data-method="email" aria-pressed="false">البريد الإلكتروني</button>
    </div>
    <label for="phone" id="phoneLabel">رقم الجوال</label>
    <div class="row">
      <span class="dial" id="dial">+20</span>
      <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="5xxxxxxxx" required>
    </div>
    <button id="btn" class="submit" type="submit">أرسل الرسالة</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
  <footer id="demo">نموذج تجريبي · Demo</footer>
</main>
<script src="../config.js"></script>
<script>window.CONFIG = { ...window.CONFIG_BASE, KIND: "welcome" };</script>
<script src="../shared/app.js"></script>
</body>
</html>
